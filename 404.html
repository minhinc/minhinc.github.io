<!DOCTYPE html>
<html>
<head>
 <meta charset="utf-8">
 <title>minhinc</title>
 <style>
  /* The full-screen background cover */
  #fouc-guard {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #ffffff; z-index: 9999; display: flex; justify-content: center; align-items: center; font-family: Arial, sans-serif; color: #ff0000;
  }
  /* Centering container */
  .spinner-container { text-align: center; }
  /* The actual spinning graphic */
  .spinner { width: 100px; height:100px ; border: 5px solid rgba(0, 0, 255, 1); border-radius: 50%; border-top-color: #3498db; animation: spin 2s ease-in-out infinite; margin: 0 auto 15px auto; }

  /* The rotation animation */
  @keyframes spin { to { transform: rotate(360deg); } }
 </style>
</head>
<body>
 <div id="fouc-guard">
  <div class="spinner-container">
   <div class="spinner"></div>
   <p>Loading...</p>
  </div>
 </div>

 <script>
  console.log(window.location.pathname);
  const BASE_URL = window.location.hostname === "minhinc.github.io"
                    ? "https://minhinc.onrender.com"
                    : `http://${window.location.hostname}:5000`;

  const path = window.location.pathname + window.location.search; // e.g. "/research" or "/training/ml"

  fetch(BASE_URL + path)
   .then(response => response.text())
   .then(data => {
        document.open();
        document.write(data);
        document.close();
   })
   .catch(err => {
    document.getElementById('dynamic-content').innerHTML = "Error loading content.";
   });
 </script>
</body>
</html>
